name: CI
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest pytest-cov ruff bandit
      - name: Compile Python files
        run: python -m compileall -q config src tests streamlit_app.py scripts deployment
      - name: Validate configuration
        run: python scripts/validate_config.py
      - name: Validate documentation structure
        run: python scripts/validate_docs.py
      - name: Validate YAML, JSON and TOML files
        run: |
          python - <<'PY'
          import json, tomllib
          from pathlib import Path
          import yaml
          root = Path('.')
          for path in list(root.rglob('*.yml')) + list(root.rglob('*.yaml')):
              if '.git' not in path.parts:
                  yaml.safe_load(path.read_text(encoding='utf-8'))
          for path in root.rglob('*.json'):
              if '.git' not in path.parts:
                  json.loads(path.read_text(encoding='utf-8'))
          for path in [Path('pyproject.toml'), Path('.streamlit/config.toml')]:
              tomllib.loads(path.read_text(encoding='utf-8'))
          print('YAML, JSON and TOML syntax checks passed.')
          PY
      - name: Lint
        run: python -m ruff check .
      - name: Run offline unit and integration tests
        run: python -m pytest tests/unit tests/integration -m "not live" --cov=src/devops_ai --cov=config --cov-branch --cov-report=term-missing
  terraform-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - name: Terraform formatting
        working-directory: infrastructure/aws
        run: terraform fmt -check -recursive
      - name: Terraform initialize without backend
        working-directory: infrastructure/aws
        run: terraform init -backend=false
      - name: Terraform validate
        working-directory: infrastructure/aws
        run: terraform validate
