services:
  ai-devops-assistant:
    build:
      context: .
      dockerfile: Containerfile
    image: localhost/ai-devops-engineer-assistant:latest
    ports:
      - "8501:8501"
    environment:
      APP_ENV: container
      COMMAND_EXECUTION_ENABLED: "false"
      REQUIRE_COMMAND_APPROVAL: "true"
      PROMETHEUS_METRICS_ENABLED: "true"
      PROMETHEUS_METRICS_PORT: "8000"
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /home/appuser/.streamlit:rw,noexec,nosuid,size=16m
    volumes:
      - ./data/docs:/app/data/docs:ro,Z
      - ./data/indexes:/app/data/indexes:rw,Z
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "deployment/healthcheck.py"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  prometheus:
    image: docker.io/prom/prometheus:v2.54.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro,Z
      - ./monitoring/prometheus/blackbox.yml:/etc/prometheus/blackbox.yml:ro,Z
      - ./monitoring/prometheus/rules:/etc/prometheus/rules:ro,Z
      - prometheus-data:/prometheus:Z
    depends_on:
      - ai-devops-assistant
      - blackbox-exporter
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  blackbox-exporter:
    image: docker.io/prom/blackbox-exporter:v0.25.0
    command:
      - --config.file=/etc/blackbox_exporter/config.yml
    volumes:
      - ./monitoring/prometheus/blackbox.yml:/etc/blackbox_exporter/config.yml:ro,Z
    expose:
      - "9115"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  grafana:
    image: docker.io/grafana/grafana:11.2.0
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env before starting the stack}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_SECURITY_COOKIE_SECURE: "false"
    volumes:
      - grafana-data:/var/lib/grafana:Z
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro,Z
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro,Z
    depends_on:
      - prometheus
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  prometheus-data:
  grafana-data:
